name: Imagen Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mimusica

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos del servidor
        run: npm run typecheck
      - name: Tipos de la consola
        run: npx tsc --noEmit -p web
      - name: Prueba de humo (biblioteca de prueba + sesión de Alexa simulada)
        run: |
          node scripts/make-test-library.ts ./testdata/music
          DATA_DIR=./testdata/data MEDIA_ROOTS=$PWD/testdata/music PUBLIC_URL=https://ci.example.ts.net \
            ALEXA_SKIP_VERIFY=1 PORT=18080 PUBLIC_PORT=18081 node server/main.ts &
          for i in $(seq 1 30); do curl -sf localhost:18080/health && break; sleep 1; done
          curl -sf -X POST localhost:18080/api/folders -H 'content-type: application/json' -d "{\"path\":\"$PWD/testdata/music\"}"
          sleep 3
          node scripts/simulate-alexa.ts http://localhost:18080 | tee out.txt
          grep -q 'Poniendo el álbum A Night at the Opera' out.txt
          grep -q 'Continuando El Principito' out.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:18081/api/summary)" = 404

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Mi Música
            org.opencontainers.image.description=Tu biblioteca de música del NAS en Alexa
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

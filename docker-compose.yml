# Mi Música — tu biblioteca del NAS en Alexa.
# Copia .env.example a .env, rellénalo y: docker compose up -d
services:
  # Tailscale publica SOLO el puerto de Alexa (8081) en Internet con HTTPS (Funnel).
  # La consola (8080) queda en tu red local y en tu tailnet.
  # No se actualiza solo a propósito: si se recrea, el contenedor de la app pierde la red.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: mimusica-tailscale
    hostname: mimusica
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:mimusica
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    ports:
      - "${CONSOLE_PORT:-8080}:8080"   # consola web en la red local: http://IP-DEL-NAS:8080
    restart: unless-stopped

  mimusica:
    # Imagen publicada por GitHub Actions en cada cambio de la rama main.
    image: ghcr.io/magnodaza/mimusica:latest
    container_name: mimusica
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - PUBLIC_URL=https://mimusica.${TS_TAILNET}.ts.net
      - ALEXA_SKILL_ID=${ALEXA_SKILL_ID:-}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      # Tu música, solo lectura. Añade más líneas si tienes varias carpetas (p. ej. /volume1/Audiolibros:/music/audiolibros:ro).
      - ${MUSIC_DIR:-/volume1/Media/Music}:/music:ro
      - ./data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=mimusica
    restart: unless-stopped

  # Actualiza "mimusica" cuando GitHub publica una imagen nueva.
  # Fork mantenido de Watchtower (el original de containrrr está archivado y falla con Docker 29+).
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: mimusica-watchtower
    environment:
      - WATCHTOWER_SCOPE=mimusica          # solo toca contenedores con esta etiqueta: no interfiere con otro Watchtower que tengas
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true            # borra la imagen vieja tras actualizar
      - WATCHTOWER_POLL_INTERVAL=${UPDATE_INTERVAL:-3600}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.scope=mimusica
    restart: unless-stopped
